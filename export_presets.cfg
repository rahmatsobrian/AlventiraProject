; PENTING: keystore development di bawah ini BUKAN untuk production/Play Store.
; Tujuannya supaya setiap build GitHub Actions memakai key yang sama persis,
; sehingga APK hasil build baru bisa meng-update APK lama tanpa uninstall.
; Tidak butuh Repository Secret sama sekali — file keystore ini memang
; sengaja ikut dikomit ke repo untuk keperluan development/internal.
;
; Catatan: config di file ini (bukan environment variable) yang terbukti
; lolos validasi preflight Godot — dikonfirmasi dari log build sebelumnya
; (error yang muncul saat itu murni soal Min/Target SDK, bukan keystore).
keystore/debug="res://android/alventira-debug.keystore"
keystore/debug_user="alventira_dev"
keystore/debug_password="alventira123"
keystore/release="res://android/alventira-debug.keystore"
keystore/release_user="alventira_dev"
keystore/release_password="alventira123"
