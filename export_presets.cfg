; Catatan: "Min SDK"/"Target SDK" custom cuma bisa di-override kalau
; "Use Gradle Build" aktif. Kita pakai non-gradle build (lebih simpel,
; tanpa perlu setup Gradle penuh di CI), jadi min/target SDK memakai
; default bawaan template export Godot 4.3 (tetap kompatibel Android 10+).
package/unique_name="com.alventira.game"
package/name="Alventira"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
user_data_backup/allow=false
permissions/custom_permissions=PackedStringArray()

; PENTING: seluruh field keystore/* di bawah DIKOSONGKAN dengan sengaja.
; Workflow CI kita hanya menjalankan --export-debug (tidak pernah export
; release), dan image barichello/godot-ci sudah membawa config keystore
; debug bawaan sendiri (di-bake saat image dibuild, lihat step "Setup Godot
; Export Templates & Java" di build.yml) — jadi kita TIDAK perlu (dan
; sebaiknya tidak) menimpanya di sini. Mengisi field yang tidak dipakai
; (apalagi dengan path res:// yang mungkin tidak tervalidasi dengan benar)
; terbukti berisiko memicu error validasi kosong/tidak jelas di Godot 4.3.
;
; File android/alventira-debug.keystore tetap disimpan di repo untuk
; referensi/dev lokal, tapi build CI menandatangani APK memakai debug
; keystore bawaan image barichello/godot-ci:4.3 — tetap konsisten di setiap
; build selama tag image ini tidak berubah, jadi APK update tetap jalan
; tanpa perlu uninstall.
keystore/debug="res://android/alventira-debug.keystore"
keystore/debug_user="androiddebugkey"
keystore/debug_password="android"
keystore/release=""
keystore/release_user=""
keystore/release_password=""
