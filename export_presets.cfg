; PENTING: keystore development di bawah ini SENGAJA dikosongkan di sini.
; Path/user/password-nya disuntikkan lewat environment variable resmi Godot
; (GODOT_ANDROID_KEYSTORE_DEBUG_PATH/USER/PASSWORD) di workflow GitHub Actions,
; bukan lewat file ini — supaya tidak ada dua sumber konfigurasi keystore yang
; bisa saling bentrok saat validasi export (masalah nyata yang pernah dilaporkan
; di Godot 4.3 saat file config dan environment variable diisi bersamaan).
; Lihat android/alventira-debug.keystore untuk file keystore-nya sendiri.
keystore/debug=""
keystore/debug_user=""
keystore/debug_password=""
keystore/release=""
keystore/release_user=""
keystore/release_password=""
