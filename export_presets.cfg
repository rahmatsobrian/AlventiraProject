screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
user_data_backup/allow=false
permissions/custom_permissions=PackedStringArray()

; PENTING: keystore/debug* di bawah DIKOSONGKAN dengan sengaja. Godot akan
; mewarisi default dari EditorSettings global (export/android/debug_keystore
; dkk, ditulis oleh workflow di step "Setup Godot Export Templates & Java")
; — ini pola resmi yang dipakai image barichello/godot-ci sendiri untuk
; debug build. keystore/release* tetap terisi karena tidak ada mekanisme
; setara untuk release (release memang wajib diisi eksplisit di preset).
;
; File keystore development-nya sendiri (bukan konfigurasinya) tetap sama
; persis di setiap build: android/alventira-debug.keystore — jadi APK hasil
; build baru tetap bisa meng-update APK lama tanpa uninstall.
keystore/debug=""
keystore/debug_user=""
keystore/debug_password=""
keystore/release="res://android/alventira-debug.keystore"
keystore/release_user="alventira_dev"
keystore/release_password="alventira123"
